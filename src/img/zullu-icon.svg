<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="ZulluOS icon">
  <!-- Small-size variant of the ZulluOS mark: the orbital ring is dropped and
       the Z reversed out of a solid badge so it stays legible at 16px. -->
  <defs>
    <linearGradient id="zulluIconBg" x1="10" y1="10" x2="90" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2f71cd"/>
      <stop offset="1" stop-color="#0a2a5e"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="20" fill="url(#zulluIconBg)"/>
  <path d="M28 30 H72 L28 70 H72" fill="none" stroke="#fff" stroke-width="12"
        stroke-linecap="square" stroke-linejoin="miter"/>
</svg>
