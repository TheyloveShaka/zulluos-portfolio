<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Shaka's Portfolio icon">
  <!-- The site's mark: a blocky "S" (same three-bar, offset-connector
       construction as a seven-segment "5"/"S") reversed out of a rounded
       Luna-blue tile, matching the "Z" mark's construction it replaces so
       it stays crisp and legible down to 16px.
       Fill colours are the exact hex values of the luna-500 and luna-900
       custom properties from src/styles/tokens.css: this file is rasterised by
       scripts/generate-icons.ts outside any browser/CSS context, so the
       tokens are inlined by value rather than referenced by var(). -->
  <defs>
    <linearGradient id="sMonogramBg" x1="10" y1="10" x2="90" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2F71CD"/>
      <stop offset="1" stop-color="#0A246A"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="20" fill="url(#sMonogramBg)"/>
  <path d="M72 30 H28 V50 H72 V70 H28" fill="none" stroke="#fff" stroke-width="12"
        stroke-linecap="square" stroke-linejoin="miter"/>
</svg>
